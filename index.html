<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ДЖАПМЕРЫ</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="128x128" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <header>
      <h1>ДЖАПМЕРЫ</h1>
      <div id="hud">
        <span id="worms">ЧЕРВЯКИ: 0/5</span>
        <span id="timer">ВРЕМЯ: 0.0</span>
        <span id="best">РЕКОРД: --</span>
        <span id="status">ВЫБОР</span>
      </div>
    </header>

    <div id="canvas-wrap">
      <canvas id="gameCanvas" width="1280" height="640"></canvas>
    </div>

    <div id="controls-hint">
      <p>← → или <strong>A</strong> <strong>D</strong> — ХОДИТЬ <br> ПРОБЕЛ или <strong>W</strong> или <strong>↑</strong> — ДЛЯ ПРЫЖКА</p>
    </div>

    <div id="mobile-controls">
      <button id="btn-left" class="mobile-btn" type="button">◀</button>
      <button id="btn-right" class="mobile-btn" type="button">▶</button>
      <button id="btn-jump" class="mobile-btn jump" type="button">▲</button>
    </div>

    <div id="buttons">
      <button id="btn-start" type="button">СТАРТ</button>
      <button id="btn-pause" type="button" disabled>ПАУЗА</button>
      <button id="btn-restart" type="button">ЗАНОВО</button>
    </div>

    <!-- Выбор персонажа -->
    <div id="char-select" class="overlay-panel">
      <h2>выбери своего -джампера-</h2>
      <div id="char-cards">
        <div class="char-card" data-char="pten1" role="button" tabindex="0">
          <canvas class="char-preview" width="120" height="100" data-char="pten1"></canvas>
          <span>джампер 1</span>
        </div>
        <div class="char-card" data-char="pten2" role="button" tabindex="0">
          <canvas class="char-preview" width="120" height="100" data-char="pten2"></canvas>
          <span>джампер 2</span>
        </div>
        <div class="char-card" data-char="pten3" role="button" tabindex="0">
          <canvas class="char-preview" width="120" height="100" data-char="pten3"></canvas>
          <span>джампер 3</span>
        </div>
      </div>
      <p class="hint">Нажми на персонажа, затем «Играть»</p>
      <button id="btn-select-play" type="button">ИГРАТЬ :D</button>
    </div>

    <div id="overlay" class="hidden">
      <div id="overlay-content">
        <h2 id="overlay-title">УРААА ПОБЕДА!</h2>
        <p id="overlay-message"></p>
        <button id="overlay-restart" type="button">ИГРАТЬ СНОВА</button>
      </div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
